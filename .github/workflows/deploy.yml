name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Route Handlers with Node fs/child_process cannot be statically exported.
      # Move them aside for the static build, then restore afterwards.
      - name: Exclude API routes for static export
        run: |
          if [ -d src/app/api ]; then
            mv src/app/api src/app/_api_server_only
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /keuangan.github.io
          STATIC_EXPORT: 'true'
        run: |
          npm run build
          touch out/.nojekyll

      - name: Restore API routes
        if: always()
        run: |
          rm -rf src/app/api
          if [ -d src/app/_api_server_only ]; then
            mv src/app/_api_server_only src/app/api
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # Deploy to gh-pages branch as a reliable fallback for repository branch-based Pages settings
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
