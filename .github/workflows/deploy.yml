name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Security Gate 1: Ensure no database files exist in public/ before build
      - name: Pre-build Security Gate
        run: |
          if [ -d public/data ] || [ -f public/demo-db.json ] || [ -f public/data/db.json ]; then
            echo "FATAL SECURITY VIOLATION: Database file detected in public/ directory!"
            exit 1
          fi

      # Route Handlers with Node fs/child_process cannot be statically exported.
      # Move them aside for the static build, then restore afterwards.
      - name: Exclude API routes for static export
        run: |
          if [ -d src/app/api ]; then
            mv src/app/api src/app/_api_server_only
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /keuangan.github.io
          STATIC_EXPORT: 'true'
        run: |
          npm run build
          touch out/.nojekyll

      # Security Gate 2: Verify zero sensitive database exposure in out/
      - name: Post-build Security Verification
        run: |
          if [ -f out/data/db.json ] || [ -f out/demo-db.json ] || [ -d out/data ]; then
            echo "FATAL SECURITY ERROR: Sensitive database file exported to out/!"
            exit 1
          fi

      - name: Deploy to gh-pages branch as fallback
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages

      - name: Restore API routes
        if: always()
        run: |
          rm -rf src/app/api
          if [ -d src/app/_api_server_only ]; then
            mv src/app/_api_server_only src/app/api
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for any branch build race condition to settle
        run: sleep 12

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
