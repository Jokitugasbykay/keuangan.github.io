name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Security Gate 1: Pre-build Secret & Repository Sanitization Check
      - name: Pre-build Security Gate
        run: |
          echo "=== RUNNING DEVSECOPS PRE-BUILD SECURITY GATE ==="
          # Check 1: Ensure git does not track any sensitive files
          TRACKED_SECRETS=$(git ls-files data/db.json data/backups .env* *.kfin.enc 2>/dev/null || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "FATAL SECURITY VIOLATION: Sensitive files are tracked in git:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi

          # Check 2: Ensure public/ directory is completely free of database/secret files
          if [ -d public/data ] || [ -f public/demo-db.json ] || [ -f public/data/db.json ] || ls public/*.kfin.enc 1> /dev/null 2>&1; then
            echo "FATAL SECURITY VIOLATION: Database or encrypted vault detected in public/ directory!"
            exit 1
          fi
          echo "Pre-build Security Gate PASSED."

      # Route Handlers with Node fs/child_process cannot be statically exported.
      # Move them aside for the static build, then restore afterwards.
      - name: Exclude API routes for static export
        run: |
          if [ -d src/app/api ]; then
            mv src/app/api src/app/_api_server_only
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: /keuangan.github.io
          STATIC_EXPORT: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          npm run build
          touch out/.nojekyll

      # Security Gate 2: Post-build Leak Detection & Artifact Integrity Verification
      - name: Post-build Security Verification
        run: |
          echo "=== RUNNING DEVSECOPS POST-BUILD LEAK AUDIT ==="
          # Check 1: Ensure no database or vault artifacts exist in out/
          if [ -f out/data/db.json ] || [ -f out/demo-db.json ] || [ -d out/data ] || ls out/*.kfin.enc 1> /dev/null 2>&1; then
            echo "FATAL SECURITY ERROR: Sensitive database or vault artifact exported to out/!"
            exit 1
          fi

          # Check 2: Scan exported bundle for personal administrator email leak
          if grep -rn "kaylafisika24@gmail.com" out/ >/dev/null 2>&1; then
            echo "FATAL SECURITY ERROR: Personal administrator email detected in static export bundle!"
            exit 1
          fi

          # Check 3: Verify .nojekyll marker exists for GitHub Pages routing
          if [ ! -f out/.nojekyll ]; then
            echo "FATAL BUILD ERROR: out/.nojekyll marker missing!"
            exit 1
          fi
          echo "Post-build Security Verification PASSED. Zero sensitive leaks detected."

      - name: Deploy to gh-pages branch as fallback
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages

      - name: Restore API routes
        if: always()
        run: |
          rm -rf src/app/api
          if [ -d src/app/_api_server_only ]; then
            mv src/app/_api_server_only src/app/api
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for any branch build race condition to settle
        run: sleep 12

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
